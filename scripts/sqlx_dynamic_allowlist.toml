# Reviewed temporary exceptions for scripts/sqlx_dynamic_guard.py.
#
# Each entry is intentionally scoped by path, forbidden symbol, and exact source
# line(s). New dynamic SQLx usage must either move to compile-checked SQLx macros
# or receive a reviewed exception with a reason, reviewer, expiration, and removal
# target.

