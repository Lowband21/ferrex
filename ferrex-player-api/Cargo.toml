[package]
name = "ferrex-player-api"
description = "HTTP API client, service traits, adapters, and API-facing DTOs for Ferrex player clients"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../README.md"
publish = true

[lints.rustdoc]
broken_intra_doc_links = "warn"
private_intra_doc_links = "warn"
missing_crate_level_docs = "allow"
private_doc_tests = "warn"
invalid_codeblock_attributes = "warn"
invalid_rust_codeblocks = "warn"
bare_urls = "warn"

[lints.rust]
# Extracted player API surfaces are still stabilizing during 0.1.0-alpha.
missing_docs = "allow"
missing_debug_implementations = "warn"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []
demo = ["ferrex-core/demo"]

[dependencies]
ferrex-core = { path = "../ferrex-core", default-features = false, features = [
  "rkyv",
] }
ferrex-model = { path = "../ferrex-model", features = [
  "serde",
  "rkyv",
  "chrono",
] }
ferrex-contracts = { path = "../ferrex-contracts", features = [
  "serde",
  "rkyv",
  "chrono",
] }
ferrex-player-foundation = { workspace = true }

anyhow.workspace = true
async-trait.workspace = true
chrono.workspace = true
log.workspace = true
parking_lot = "0.12"
reqwest.workspace = true
rkyv.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["sync"] }
urlencoding = "2"
uuid.workspace = true
