app-id: io.github.lowband21.FerrexPlayer
runtime: org.freedesktop.Platform
runtime-version: "24.08"
sdk: org.freedesktop.Sdk
command: ferrex-player

build-options:
  # Keep builds reliable: stripping can break the embedded Rust toolchain
  # used during the build. We remove the toolchain from the final bundle via
  # `cleanup`.
  strip: false
  no-debuginfo: true

cleanup:
  - /tools/rust

finish-args:
  # GPU + graphics
  - --device=dri
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  # Network access to reach a Ferrex server
  - --filesystem=xdg-cache
  - --share=network

modules:
  - name: rust-toolchain
    buildsystem: simple
    build-commands:
      - sh ./install.sh --prefix=/app/tools/rust
    sources:
      - type: archive
        url: https://static.rust-lang.org/dist/rust-1.92.0-x86_64-unknown-linux-gnu.tar.xz
        sha256: d2ccef59dd9f7439f2c694948069f789a044dc1addcc0803613232af8f88ee0c

  - name: gstreamer
    buildsystem: meson
    config-opts:
      - -Ddoc=disabled
      - -Dintrospection=disabled
      - -Dauto_features=disabled
    sources:
      - type: archive
        url: https://gstreamer.freedesktop.org/src/gstreamer/gstreamer-1.28.4.tar.xz
        sha256: f5adc7e8f448c10260b3b25aa101c9d540674c8d9a54c2b77a86d04f2b3b50dd

  - name: gst-plugins-base
    buildsystem: meson
    config-opts:
      - -Ddoc=disabled
      - -Dintrospection=disabled
      - -Dauto_features=disabled
    sources:
      - type: archive
        url: https://gstreamer.freedesktop.org/src/gst-plugins-base/gst-plugins-base-1.28.4.tar.xz
        sha256: a898afd5766172b0049e6781558e0689098bf87b9d82b846c652e571c01d60d8

  - name: gst-plugins-good
    buildsystem: meson
    config-opts:
      - -Ddoc=disabled
      - -Dauto_features=disabled
    sources:
      - type: archive
        url: https://gstreamer.freedesktop.org/src/gst-plugins-good/gst-plugins-good-1.28.4.tar.xz
        sha256: c825ea737c59cea0e4a0c41da2388045ff5dd32d162220ac93a7a82ee4a04e61

  - name: gst-plugins-bad
    buildsystem: meson
    config-opts:
      - -Ddoc=disabled
      - -Dgpl=enabled
      - -Dwayland=enabled
      - -Dva=enabled
      - -Dclosedcaption=enabled
      - -Dtflite=disabled
      - -Dmpeghdec=disabled
      - -Dwpe2=disabled
      - -Dwebrtc=disabled
      - -Dwebrtcdsp=disabled
      - -Dlcevcdecoder=disabled
    sources:
      - type: archive
        url: https://gstreamer.freedesktop.org/src/gst-plugins-bad/gst-plugins-bad-1.28.4.tar.xz
        sha256: 332b7320f30c60f2d5941446d03b9d05e3781f2c2561befbe88718bd777f0e47

  - name: gst-plugins-ugly
    buildsystem: meson
    config-opts:
      - -Ddoc=disabled
      - -Dgpl=enabled
    sources:
      - type: archive
        url: https://gstreamer.freedesktop.org/src/gst-plugins-ugly/gst-plugins-ugly-1.28.4.tar.xz
        sha256: 5486cd145c5af43259fd37caca59d048e2a67ddb07082ea8f50ef0f02a85f8a5

  - name: gst-libav
    buildsystem: meson
    config-opts:
      - -Ddoc=disabled
    sources:
      - type: archive
        url: https://gstreamer.freedesktop.org/src/gst-libav/gst-libav-1.28.4.tar.xz
        sha256: bd17a5df2874a7a58bcbaf7b940223379ad9613624db8ead783db03e74bb904b

  - name: ferrex-player
    buildsystem: simple
    build-options:
      build-args:
        - --share=network
      append-path: /app/tools/rust/bin
      env:
        SQLX_OFFLINE: "true"
        CARGO_HOME: /run/build/ferrex-player/cargo-home
        CARGO_TARGET_DIR: /run/build/ferrex-player/target
        PKG_CONFIG_PATH: /app/lib/pkgconfig:/app/share/pkgconfig
    build-commands:
      - cargo build --release -p ferrex-player
      - install -Dm755 /run/build/ferrex-player/target/release/ferrex-player /app/bin/ferrex-player
      - install -Dm644 flatpak/io.github.lowband21.FerrexPlayer.desktop /app/share/applications/io.github.lowband21.FerrexPlayer.desktop
      - install -Dm644 flatpak/io.github.lowband21.FerrexPlayer.metainfo.xml /app/share/metainfo/io.github.lowband21.FerrexPlayer.metainfo.xml
      - install -Dm644 flatpak/icons/128x128/apps/io.github.lowband21.FerrexPlayer.png /app/share/icons/hicolor/128x128/apps/io.github.lowband21.FerrexPlayer.png
      - install -Dm644 flatpak/icons/192x192/apps/io.github.lowband21.FerrexPlayer.png /app/share/icons/hicolor/192x192/apps/io.github.lowband21.FerrexPlayer.png
      - install -Dm644 flatpak/icons/512x512/apps/io.github.lowband21.FerrexPlayer.png /app/share/icons/hicolor/512x512/apps/io.github.lowband21.FerrexPlayer.png
    sources:
      - type: dir
        path: ..
