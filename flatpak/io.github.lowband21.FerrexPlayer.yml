app-id: io.github.lowband21.FerrexPlayer
runtime: org.freedesktop.Platform
runtime-version: "24.08"
sdk: org.freedesktop.Sdk
command: ferrex-player

build-options:
  # Keep builds reliable: stripping can break the embedded Rust toolchain
  # used during the build. We remove the toolchain from the final bundle via
  # `cleanup`.
  strip: false
  no-debuginfo: true

cleanup:
  - /tools/rust

finish-args:
  # GPU + graphics
  - --device=dri
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  # Network access to reach a Ferrex server
  - --filesystem=xdg-cache
  - --share=network

modules:
  - name: rust-toolchain
    buildsystem: simple
    build-commands:
      - sh ./install.sh --prefix=/app/tools/rust
    sources:
      - type: archive
        url: https://static.rust-lang.org/dist/rust-1.92.0-x86_64-unknown-linux-gnu.tar.xz
        sha256: d2ccef59dd9f7439f2c694948069f789a044dc1addcc0803613232af8f88ee0c

  - name: gstreamer
    buildsystem: meson
    config-opts:
      - -Ddoc=disabled
      - -Dintrospection=disabled
      - -Dauto_features=disabled
    sources:
      - type: archive
        url: https://gstreamer.freedesktop.org/src/gstreamer/gstreamer-1.28.4.tar.xz
        sha256: f5adc7e8f448c10260b3b25aa101c9d540674c8d9a54c2b77a86d04f2b3b50dd

  - name: gst-plugins-base
    buildsystem: meson
    config-opts:
      - -Ddoc=disabled
      - -Dintrospection=disabled
      - -Dauto_features=disabled
    sources:
      - type: archive
        url: https://gstreamer.freedesktop.org/src/gst-plugins-base/gst-plugins-base-1.28.4.tar.xz
        sha256: a898afd5766172b0049e6781558e0689098bf87b9d82b846c652e571c01d60d8

  - name: gst-plugins-good
    buildsystem: meson
    config-opts:
      - -Ddoc=disabled
      - -Dauto_features=disabled
    sources:
      - type: archive
        url: https://gstreamer.freedesktop.org/src/gst-plugins-good/gst-plugins-good-1.28.4.tar.xz
        sha256: c825ea737c59cea0e4a0c41da2388045ff5dd32d162220ac93a7a82ee4a04e61

  - name: gst-plugins-bad
    buildsystem: meson
    config-opts:
      - -Ddoc=disabled
      - -Dgpl=enabled
      - -Dwayland=enabled
      - -Dva=enabled
      - -Dclosedcaption=enabled
      - -Dtflite=disabled
      - -Dmpeghdec=disabled
      - -Dwpe2=disabled
      - -Dwebrtc=disabled
      - -Dwebrtcdsp=disabled
      - -Dlcevcdecoder=disabled
    sources:
      - type: archive
        url: https://gstreamer.freedesktop.org/src/gst-plugins-bad/gst-plugins-bad-1.28.4.tar.xz
        sha256: 332b7320f30c60f2d5941446d03b9d05e3781f2c2561befbe88718bd777f0e47

  - name: gst-plugins-ugly
    buildsystem: meson
    config-opts:
      - -Ddoc=disabled
      - -Dgpl=enabled
    sources:
      - type: archive
        url: https://gstreamer.freedesktop.org/src/gst-plugins-ugly/gst-plugins-ugly-1.28.4.tar.xz
        sha256: 5486cd145c5af43259fd37caca59d048e2a67ddb07082ea8f50ef0f02a85f8a5

  # libmpv is linked into the permissively licensed Ferrex binary, so keep
  # this profile synchronized with D-005 and the Nix LGPL profile.  In
  # particular, never inherit a distro mpv built with its default GPL option.
  - name: libass
    config-opts:
      - --disable-static
      - --enable-asm
      - --enable-fontconfig
      - --enable-harfbuzz
    post-install:
      - install -Dm644 COPYING /app/share/licenses/io.github.lowband21.FerrexPlayer/libass/COPYING
    cleanup:
      - /include/ass
      - /lib/libass.la
      - /lib/pkgconfig/libass.pc
    sources:
      - type: git
        url: https://github.com/libass/libass.git
        tag: 0.17.4
        commit: bbb3c7f1570a4a021e52683f3fbdf74fe492ae84

  - name: ffmpeg-lgpl
    config-opts:
      - --disable-debug
      - --disable-doc
      - --disable-programs
      - --disable-static
      - --disable-gpl
      - --disable-nonfree
      - --disable-version3
      - --enable-shared
      - --enable-gnutls
      - --enable-libass
      - --enable-libdrm
      - --enable-vaapi
      - --enable-vulkan
    post-install:
      - >-
        if grep -Eq '^CONFIG_(GPL|NONFREE|VERSION3)=yes$' ffbuild/config.mak;
        then echo 'FFmpeg resolved a restricted license option' >&2; exit 1;
        fi
      - install -Dm644 COPYING.LGPLv2.1 /app/share/licenses/io.github.lowband21.FerrexPlayer/ffmpeg/COPYING.LGPLv2.1
      - install -Dm644 LICENSE.md /app/share/licenses/io.github.lowband21.FerrexPlayer/ffmpeg/LICENSE.md
      - >-
        printf '%s\n' 'FFmpeg n8.1.2' 'gpl=no' 'nonfree=no'
        'version3=no' 'shared=yes' 'gnutls=yes' 'libass=yes'
        'libdrm=yes' 'vaapi=yes' 'vulkan=yes'
        > /app/share/licenses/io.github.lowband21.FerrexPlayer/ffmpeg/BUILD_PROFILE
    cleanup:
      - /include/libavcodec
      - /include/libavdevice
      - /include/libavfilter
      - /include/libavformat
      - /include/libavutil
      - /include/libpostproc
      - /include/libswresample
      - /include/libswscale
      - /lib/pkgconfig/libavcodec.pc
      - /lib/pkgconfig/libavdevice.pc
      - /lib/pkgconfig/libavfilter.pc
      - /lib/pkgconfig/libavformat.pc
      - /lib/pkgconfig/libavutil.pc
      - /lib/pkgconfig/libpostproc.pc
      - /lib/pkgconfig/libswresample.pc
      - /lib/pkgconfig/libswscale.pc
      - /share/ffmpeg/examples
    sources:
      - type: git
        url: https://github.com/FFmpeg/FFmpeg.git
        tag: n8.1.2
        commit: 38b88335f99e76ed89ff3c93f877fdefce736c13

  # Build gst-libav against the bundled FFmpeg ABI instead of loading a second
  # runtime FFmpeg into the same process.
  - name: gst-libav
    buildsystem: meson
    config-opts:
      - -Ddoc=disabled
    sources:
      - type: archive
        url: https://gstreamer.freedesktop.org/src/gst-libav/gst-libav-1.28.4.tar.xz
        sha256: bd17a5df2874a7a58bcbaf7b940223379ad9613624db8ead783db03e74bb904b

  - name: luajit
    no-autogen: true
    make-args:
      - BUILDMODE=dynamic
      - PREFIX=/app
    make-install-args:
      - PREFIX=/app
    post-install:
      - install -Dm644 COPYRIGHT /app/share/licenses/io.github.lowband21.FerrexPlayer/luajit/COPYRIGHT
    cleanup:
      - /bin/luajit*
      - /include/luajit-*
      - /lib/pkgconfig/luajit.pc
      - /share/man/man1/luajit.1
    sources:
      - type: git
        url: https://github.com/openresty/luajit2.git
        tag: v2.1-20260620
        commit: b411bec3ce550ef9968fc83bca094455cf812c1f

  - name: libplacebo
    buildsystem: meson
    config-opts:
      - -Ddefault_library=shared
      - -Dvulkan=enabled
      - -Dshaderc=enabled
      - -Dopengl=enabled
      - -Dlcms=enabled
      - -Ddemos=false
      - -Dtests=false
      - -Dbench=false
    post-install:
      - install -Dm644 ../LICENSE /app/share/licenses/io.github.lowband21.FerrexPlayer/libplacebo/LICENSE
      - >-
        printf '%s\n' 'libplacebo 7.360.1' 'shared=yes' 'vulkan=enabled'
        'shaderc=enabled' 'opengl=enabled' 'lcms=enabled'
        > /app/share/licenses/io.github.lowband21.FerrexPlayer/libplacebo/BUILD_PROFILE
    cleanup:
      - /include/libplacebo
      - /lib/pkgconfig/libplacebo.pc
    sources:
      - type: git
        url: https://github.com/haasn/libplacebo.git
        tag: v7.360.1
        commit: cee9b076f2c63104ccfd497fa79c39a867293ec4

  - name: mpv-lgpl
    buildsystem: meson
    config-opts:
      - -Dgpl=false
      - -Dbuild-date=false
      - -Dcplayer=false
      - -Dlibmpv=true
      - -Dtests=false
      - -Dfuzzers=false
      - -Dmanpage-build=disabled
      - -Dhtml-build=disabled
      - -Dpdf-build=disabled
      - -Dcdda=disabled
      - -Ddvbin=disabled
      - -Ddvdnav=disabled
      - -Djavascript=disabled
      - -Dlua=enabled
      - -Drubberband=disabled
      - -Duchardet=disabled
      - -Dvapoursynth=disabled
      - -Dzimg=disabled
      - -Dalsa=disabled
      - -Dpipewire=enabled
      - -Dpulse=enabled
      - -Ddmabuf-wayland=enabled
      - -Ddrm=disabled
      - -Degl=enabled
      - -Degl-wayland=enabled
      - -Degl-x11=disabled
      - -Dgbm=disabled
      - -Dgl=enabled
      - -Dplain-gl=enabled
      - -Dshaderc=disabled
      - -Dvaapi=enabled
      - -Dvaapi-drm=disabled
      - -Dvaapi-wayland=enabled
      - -Dvaapi-x11=disabled
      - -Dvulkan=enabled
      - -Dwayland=enabled
      # mpv 0.41's X11 VO sources are GPL-only. The Flatpak must keep this
      # disabled under D-005 and use the existing GStreamer fallback on X11.
      - -Dx11=disabled
    post-install:
      - >-
        python3 -c "import json;
        options={item['name']: item['value'] for item in json.load(open('meson-info/intro-buildoptions.json', encoding='utf-8'))};
        required={'gpl': False, 'libmpv': True, 'vulkan': 'enabled', 'wayland': 'enabled', 'x11': 'disabled', 'dmabuf-wayland': 'enabled'};
        missing={key: (options.get(key), value) for key, value in required.items() if options.get(key) != value};
        assert not missing, f'unexpected mpv build options: {missing}'"
      - test -e /app/lib/libmpv.so.2
      - install -Dm644 ../LICENSE.LGPL /app/share/licenses/io.github.lowband21.FerrexPlayer/mpv/LICENSE.LGPL
      - >-
        printf '%s\n' 'mpv 0.41.0 / client API 2.5'
        'gpl=false' 'libmpv=true' 'vulkan=enabled' 'wayland=enabled'
        'dmabuf-wayland=enabled' 'x11=disabled'
        > /app/share/licenses/io.github.lowband21.FerrexPlayer/mpv/BUILD_PROFILE
    cleanup:
      - /include/mpv
      - /lib/pkgconfig/mpv.pc
    sources:
      - type: git
        url: https://github.com/mpv-player/mpv.git
        tag: v0.41.0
        commit: 41f6a645068483470267271e1d09966ca3b9f413

  - name: ferrex-player
    buildsystem: simple
    build-options:
      build-args:
        - --share=network
      append-path: /app/tools/rust/bin
      env:
        SQLX_OFFLINE: "true"
        # Compiles the D-023 preflight that rejects X11-only sessions before
        # starting this LGPL libmpv build, whose X11 VO is intentionally absent.
        FERREX_MPV_X11: "disabled"
        CARGO_HOME: /run/build/ferrex-player/cargo-home
        CARGO_TARGET_DIR: /run/build/ferrex-player/target
        PKG_CONFIG_PATH: /app/lib/pkgconfig:/app/share/pkgconfig
    build-commands:
      - cargo build --release -p ferrex-player --features mpv
      - install -Dm755 /run/build/ferrex-player/target/release/ferrex-player /app/bin/ferrex-player
      - readelf -d /app/bin/ferrex-player | grep -q 'Shared library: \[libmpv.so.2\]'
      - test "$(pkg-config --modversion mpv)" = 2.5.0
      - install -Dm644 flatpak/io.github.lowband21.FerrexPlayer.desktop /app/share/applications/io.github.lowband21.FerrexPlayer.desktop
      - install -Dm644 flatpak/io.github.lowband21.FerrexPlayer.metainfo.xml /app/share/metainfo/io.github.lowband21.FerrexPlayer.metainfo.xml
      - install -Dm644 flatpak/icons/128x128/apps/io.github.lowband21.FerrexPlayer.png /app/share/icons/hicolor/128x128/apps/io.github.lowband21.FerrexPlayer.png
      - install -Dm644 flatpak/icons/192x192/apps/io.github.lowband21.FerrexPlayer.png /app/share/icons/hicolor/192x192/apps/io.github.lowband21.FerrexPlayer.png
      - install -Dm644 flatpak/icons/512x512/apps/io.github.lowband21.FerrexPlayer.png /app/share/icons/hicolor/512x512/apps/io.github.lowband21.FerrexPlayer.png
    sources:
      - type: dir
        path: ..
