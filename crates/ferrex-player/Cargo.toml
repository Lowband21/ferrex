[package]
name = "ferrex-player"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords.workspace = true
categories.workspace = true
description = "Cross-platform desktop player binary and compatibility facade for Ferrex"

[lints.rustdoc]
broken_intra_doc_links = "warn"
private_intra_doc_links = "warn"
missing_crate_level_docs = "warn"
private_doc_tests = "warn"
invalid_codeblock_attributes = "warn"
invalid_rust_codeblocks = "warn"
bare_urls = "warn"

[lints.rust]
# The facade preserves historical public imports during the extraction stack.
missing_docs = "allow"
missing_debug_implementations = "warn"

[dependencies]
ferrex-player-app = { workspace = true }

[features]
default = []
legacy-settings = ["ferrex-player-app/legacy-settings"]
iced_tester = ["ferrex-player-app/iced_tester"]
hot = ["ferrex-player-app/hot"]
debug = ["ferrex-player-app/debug"]
demo = ["ferrex-player-app/demo"]
gpu-tests = ["ferrex-player-app/gpu-tests"]
debug-cache-overlay = ["ferrex-player-app/debug-cache-overlay"]
# For compiling out features that have not been fully implemented
unimplemented = ["ferrex-player-app/unimplemented"]

profile-with-puffin = ["ferrex-player-app/profile-with-puffin"]
profile-with-tracy = ["ferrex-player-app/profile-with-tracy"]
profile-with-tracing = ["ferrex-player-app/profile-with-tracing"]
profiling-stats = ["ferrex-player-app/profiling-stats"]

[dev-dependencies]
anyhow.workspace = true
async-trait.workspace = true
chrono.workspace = true
ferrex-core = { path = "../ferrex-core", default-features = false, features = [
  "rkyv",
] }
ferrex-model = { path = "../ferrex-model", features = [
  "serde",
  "rkyv",
  "chrono",
] }
ferrex-player-auth = { workspace = true }
futures.workspace = true
iced = { git = "https://github.com/Lowband21/iced-ferrex.git", default-features = false, features = [
  "tokio",
  "image",
  "canvas",
  "advanced",
  "wgpu",
  "wayland",
  "batch",
  "lazy",
  "crisp",
] }
iced_runtime = { git = "https://github.com/Lowband21/iced-ferrex.git", package = "iced_runtime" }
rand.workspace = true
serde_json.workspace = true
tokio.workspace = true
uuid.workspace = true
