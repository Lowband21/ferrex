[package]
name = "ferrex-player-playback"
description = "Playback state, controls, video, and MPV integration domain for Ferrex player clients"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../../README.md"
publish = true

[lints.rustdoc]
broken_intra_doc_links = "warn"
private_intra_doc_links = "warn"
missing_crate_level_docs = "warn"
private_doc_tests = "warn"
invalid_codeblock_attributes = "warn"
invalid_rust_codeblocks = "warn"
bare_urls = "warn"

[lints.rust]
# Playback state/control APIs are still stabilizing during the player extraction stack.
missing_docs = "allow"
missing_debug_implementations = "warn"

[features]
default = ["ui"]
ui = ["dep:iced_wgpu", "dep:lucide-icons"]
mpv = ["dep:ferrex-player-mpv", "ferrex-player-mpv/linked"]
profile-with-puffin = ["dep:profiling", "profiling/profile-with-puffin"]
profile-with-tracy = ["dep:profiling"]
profile-with-tracing = ["dep:profiling"]

[dependencies]
ferrex-core = { path = "../ferrex-core", default-features = false, features = ["rkyv"] }
ferrex-player-api = { workspace = true }
ferrex-player-foundation = { workspace = true }
ferrex-player-mpv = { workspace = true, optional = true }

iced = { git = "https://github.com/Lowband21/iced-ferrex.git", default-features = false, features = ["tokio", "image", "canvas", "advanced", "wgpu", "wayland", "batch", "lazy", "crisp"] }
iced_wgpu = { git = "https://github.com/Lowband21/iced-ferrex.git", features = ["image", "batch"], optional = true }
lucide-icons = { git = "https://github.com/Lowband21/lucide-icons-iced-0.14.git", features = ["iced"], optional = true }
subwave_unified = { git = "https://github.com/Lowband21/subwave.git", branch = "main" }
subwave_core = { git = "https://github.com/Lowband21/subwave.git", branch = "main" }

futures.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
url = "2"
zeroize.workspace = true
urlencoding = "2"
dirs = "6"
profiling = { version = "1.0", optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_UI_HiDpi",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
  "std",
  "NSGraphics",
  "NSResponder",
  "NSView",
  "NSWindow",
  "objc2-core-foundation",
] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
  "std",
  "NSGeometry",
  "NSObject",
] }
