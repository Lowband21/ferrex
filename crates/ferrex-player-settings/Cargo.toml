[package]
name = "ferrex-player-settings"
description = "Settings domain state, messages, DTOs, and reducer helpers for Ferrex player clients"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../../README.md"
publish = true

[lints.rustdoc]
broken_intra_doc_links = "warn"
private_intra_doc_links = "warn"
missing_crate_level_docs = "warn"
private_doc_tests = "warn"
invalid_codeblock_attributes = "warn"
invalid_rust_codeblocks = "warn"
bare_urls = "warn"

[lints.rust]
# Extracted player settings surfaces are still stabilizing during the 0.1.x pre-release cycle.
missing_docs = "allow"
missing_debug_implementations = "warn"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
ferrex-core = { path = "../ferrex-core", default-features = false, features = [
  "rkyv",
] }
ferrex-model = { path = "../ferrex-model", features = [
  "serde",
  "rkyv",
  "chrono",
] }
ferrex-player-api = { workspace = true }
ferrex-player-auth = { workspace = true }
ferrex-player-foundation = { workspace = true }

chrono.workspace = true
hsluv = "0.3"
iced_core = { git = "https://github.com/Lowband21/iced-ferrex.git", package = "iced_core" }
serde.workspace = true
uuid.workspace = true
