[package]
name = "ferrex-player-library"
description = "Library data domain, media repository, and scan subscriptions for the Ferrex player"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../../README.md"
publish = true

[lints.rustdoc]
broken_intra_doc_links = "warn"
private_intra_doc_links = "warn"
missing_crate_level_docs = "warn"
private_doc_tests = "warn"
invalid_codeblock_attributes = "warn"
invalid_rust_codeblocks = "warn"
bare_urls = "warn"

[lints.rust]
# Library domain APIs were extracted from the player monolith and still expose transitional state fields.
missing_docs = "allow"
missing_debug_implementations = "warn"

[features]
default = []
demo = ["ferrex-core/demo", "ferrex-player-api/demo"]

[dependencies]
ferrex-core = { path = "../ferrex-core", default-features = false, features = ["rkyv"] }
ferrex-model = { path = "../ferrex-model", features = ["serde", "rkyv", "chrono"] }
ferrex-contracts = { path = "../ferrex-contracts", features = ["serde", "rkyv", "chrono"] }
ferrex-player-api = { workspace = true }
ferrex-player-foundation = { workspace = true }
ferrex-player-repository = { workspace = true }

anyhow.workspace = true
base64.workspace = true
chrono.workspace = true
eventsource-stream = "0.2"
futures.workspace = true
log.workspace = true
parking_lot = "0.12"
reqwest.workspace = true
reqwest-eventsource = "0.6"
rkyv.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["sync"] }
uuid.workspace = true
yoke = "0.8.1"
