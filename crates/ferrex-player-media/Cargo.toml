[package]
name = "ferrex-player-media"
description = "Media/watch-state data domain for the Ferrex player"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../../README.md"
publish = true

[lints.rustdoc]
broken_intra_doc_links = "warn"
private_intra_doc_links = "warn"
missing_crate_level_docs = "allow"
private_doc_tests = "warn"
invalid_codeblock_attributes = "warn"
invalid_rust_codeblocks = "warn"
bare_urls = "warn"

[lints.rust]
missing_docs = "allow"
missing_debug_implementations = "warn"

[features]
default = []

[dependencies]
ferrex-core = { path = "../ferrex-core", default-features = false, features = ["rkyv"] }
ferrex-model = { path = "../ferrex-model", features = ["serde", "rkyv", "chrono"] }
ferrex-player-api = { workspace = true }
ferrex-player-foundation = { workspace = true }
ferrex-player-library = { workspace = true }

chrono.workspace = true
log.workspace = true
