[package]
name = "ferrex-player-intelligence"
description = "UI-agnostic smart-shelf state, reducer, and command intents for Ferrex player clients"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../../README.md"
publish = true

[lints.rustdoc]
broken_intra_doc_links = "warn"
private_intra_doc_links = "warn"
missing_crate_level_docs = "warn"
private_doc_tests = "warn"
invalid_codeblock_attributes = "warn"
invalid_rust_codeblocks = "warn"
bare_urls = "warn"

[lints.rust]
# Smart-shelf reducer surfaces are stabilizing during the player extraction stack.
missing_docs = "allow"
missing_debug_implementations = "warn"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
ferrex-player-api = { workspace = true }

serde.workspace = true
serde_json.workspace = true
uuid.workspace = true

[dev-dependencies]
chrono.workspace = true
