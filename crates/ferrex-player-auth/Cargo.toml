[package]
name = "ferrex-player-auth"
description = "Authentication domain, local auth storage, and auth service adapters for Ferrex player clients"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../../README.md"
publish = true

[lints.rustdoc]
broken_intra_doc_links = "warn"
private_intra_doc_links = "warn"
missing_crate_level_docs = "allow"
private_doc_tests = "warn"
invalid_codeblock_attributes = "warn"
invalid_rust_codeblocks = "warn"
bare_urls = "warn"

[lints.rust]
# Extracted player auth surfaces are still stabilizing during 0.1.0-alpha.
missing_docs = "allow"
missing_debug_implementations = "warn"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []
demo = ["ferrex-player-api/demo"]

[dependencies]
ferrex-core = { path = "../ferrex-core", default-features = false, features = [
  "rkyv",
] }
ferrex-player-api = { workspace = true }
ferrex-player-foundation = { workspace = true }

aes-gcm.workspace = true
anyhow.workspace = true
argon2.workspace = true
async-trait.workspace = true
base64.workspace = true
chrono.workspace = true
directories = "6"
ed25519-dalek = { version = "2", default-features = false, features = [
  "rand_core",
] }
getrandom = "0.3"
hkdf = "0.12"
log.workspace = true
mac_address = "1.1"
rand.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sysinfo = "0.37"
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "sync"] }
uuid.workspace = true
zeroize.workspace = true

[dev-dependencies]
tempfile.workspace = true
