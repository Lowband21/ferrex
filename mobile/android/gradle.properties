# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX is required by activity-compose and Compose Material.
android.useAndroidX=true

# Kotlin source formatting.
kotlin.code.style=official

# Keep generated R references scoped to this module.
android.nonTransitiveRClass=true

# Machine-specific Android SDK overrides (for example, a NixOS-patched
# android.aapt2FromMavenOverride) belong in ~/.gradle/gradle.properties.
